<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DuctControl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container d-flex flex-wrap align-items-center justify-content-between">
      <a class="brand" href="/">Duct<span>Control</span></a>
      <nav class="nav">
        <a class="nav-link {{ 'active' if nav == 'dashboard' }}" href="/">Dashboard</a>
        <a class="nav-link {{ 'active' if nav == 'projects' }}" href="/projects">Projects</a>
        <a class="nav-link {{ 'active' if nav == 'clients' }}" href="/clients">Clients</a>
        <a class="nav-link {{ 'active' if nav == 'reports' }}" href="/reports">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
